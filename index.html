<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>

</div>
</div>
</section>

<section id="success">
<div class="photoWrap"><img src="photo.jpg"></div>
<h1>Congratulations Buggu 🎉</h1>
<h3>You've successfully subscribed to Premium Happiness™</h3>
<p>Unlimited love • Lifetime validity • Auto‑renewed forever</p>
